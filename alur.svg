<text x="0" y="0" class="m" text-anchor="middle" transform="translate(1163 1200) rotate(-90)">ulang terus</text>
<rect x="40" y="1590" width="1120" height="325" rx="12" fill="#fafafa" stroke="#d1d5db" stroke-width="1.2"/>
<text x="56" y="1612" class="h" text-anchor="start" fill="#374151">Penutupan</text>
