<rect x="400" y="1630" width="400" height="36" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="600.0" y="1652.5" class="t" text-anchor="middle">except KeyboardInterrupt: cetak [berhenti]</text>
<path d="M600,1666 V1686" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="300" y="1686" width="600" height="88" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="600.0" y="1709.8" class="t" text-anchor="middle">finally di pipeline.jalankan()</text>
<text x="600.0" y="1726.2" class="s" text-anchor="middle">berhenti.set() · kirim sentinel None ke antrian_segmen</text>
<text x="600.0" y="1742.8" class="s" text-anchor="middle">pekerja.join(timeout 2 dtk) → thread 'inferensi' selesai</text>
<text x="600.0" y="1759.2" class="s" text-anchor="middle">vad.reset_states() · stream mic ditutup (with penangkap)</text>
<path d="M600,1774 V1794" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="300" y="1794" width="600" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="600.0" y="1812.2" class="t" text-anchor="middle">jalankan() return 0 → kembali ke main()</text>
<text x="600.0" y="1828.8" class="s" text-anchor="middle">finally: servo.tutup() → kirim pose netral, tutup port</text>
