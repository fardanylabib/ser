<text x="935.0" y="1437.5" class="s" text-anchor="middle">ke_tick → bingkai UART, hanya jika pose berubah</text>
<text x="935.0" y="1454.0" class="s" text-anchor="middle">tanpa --port: pose dicetak ke terminal</text>
