<text x="265.0" y="1456.2" class="t" text-anchor="middle">KeyboardInterrupt</text>
<text x="265.0" y="1472.8" class="s" text-anchor="middle">loop di thread utama terputus</text>
<rect x="520" y="935" width="160" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="600.0" y="953.2" class="t" text-anchor="middle">antrian_segmen</text>
<text x="600.0" y="969.8" class="s" text-anchor="middle">maxsize=2, buang terlama</text>
<path d="M460,1317 H600 V979" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="608" y="1150" class="m" text-anchor="start">jendela audio</text>
<text x="608" y="1165" class="m" text-anchor="start">atau AKHIR</text>
<path d="M680,957 H740" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="740" y="935" width="390" height="44" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="935.0" y="953.2" class="t" text-anchor="middle">PengendaliEkspresi.loop()</text>
<text x="935.0" y="969.8" class="s" text-anchor="middle">while not berhenti.is_set(): get(timeout 0,2)</text>
<path d="M935,979 V1003" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="740" y="1003" width="390" height="104" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="935.0" y="1026.5" class="t" text-anchor="middle">item dari antrian_segmen?</text>
<text x="935.0" y="1043.0" class="s" text-anchor="middle">kosong (timeout) → _saat_diam() (netral jika &gt; 2,5 dtk)</text>
<text x="935.0" y="1059.5" class="s" text-anchor="middle">AKHIR → ema = None (frasa baru dinilai segar)</text>
<text x="935.0" y="1076.0" class="s" text-anchor="middle">None → break, thread berhenti</text>
<text x="935.0" y="1092.5" class="s" text-anchor="middle">jendela audio → _proses()</text>
<path d="M935,1107 V1131" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="945" y="1124" class="m" text-anchor="start">jendela audio</text>
<rect x="740" y="1131" width="390" height="44" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="935.0" y="1149.2" class="t" text-anchor="middle">_proses(): pengenal.probabilitas(audio)</text>
<text x="935.0" y="1165.8" class="s" text-anchor="middle">extractor → wav2vec2 → softmax</text>
<path d="M935,1175 V1195" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="740" y="1195" width="390" height="44" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="935.0" y="1213.2" class="t" text-anchor="middle">peredam EMA</text>
<text x="935.0" y="1229.8" class="s" text-anchor="middle">ema = 0,6 · ema + 0,4 · probs</text>
<path d="M935,1239 V1259" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="740" y="1259" width="390" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="935.0" y="1277.0" class="t" text-anchor="middle">_skor_ekspresi()</text>
<text x="935.0" y="1293.5" class="s" text-anchor="middle">label → senyum / netral / sedih / marah / kaget</text>
<text x="935.0" y="1310.0" class="s" text-anchor="middle">bobot sedih ×1,8 · netral ×0,7, lalu normalisasi</text>
<path d="M935,1319 V1339" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="740" y="1339" width="390" height="44" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="935.0" y="1357.2" class="t" text-anchor="middle">pose.hitung_pose(skor, ambang 0,4)</text>
<text x="935.0" y="1373.8" class="s" text-anchor="middle">7 gerakan, tiap nilai -10 … 10</text>
<path d="M935,1383 V1403" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="740" y="1403" width="390" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
